name: Generate Blog Post Draft

on:
  schedule:
    # Run at 06:00 UTC on Tuesday (1 draft/week — quality over volume; the
    # topic queue in scripts/topics.json is finite and never repeats)
    - cron: "0 6 * * 2"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post draft
        run: npm run generate-blog
        env:
          OPENAI_API_KEY: ${{ secrets.NOA_BLOG }}

      # Editorial policy (blog/EDITORIAL.md): drafts are never published
      # unedited. The draft lands as a PR; a human rewrites weak sections,
      # adds lived detail, then merges. If it isn't worth editing, close it.
      - name: Open draft PR for editing
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            blog/posts/
            scripts/topics.json
          branch: blog/draft-${{ github.run_id }}
          commit-message: "blog: draft for $(date -u +%Y-%m-%d) — needs human edit"
          title: "Blog draft: needs human edit before publishing"
          body: |
            Automated draft from the topic queue. **Do not merge as-is.**

            Editing checklist (see `blog/EDITORIAL.md`):
            - [ ] Rewrite the opening scene from real life if it feels generic
            - [ ] Cut anything you wouldn't say out loud
            - [ ] Check the target query appears in title + one H2, naturally
            - [ ] Verify internal links point at real pages
            - [ ] Read it aloud once
