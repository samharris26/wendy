name: Generate Blog Post

on:
  schedule:
    # Run at 06:00 UTC on Tuesday (1 post/week). The topic queue in
    # scripts/topics.json is finite and one-shot — each topic is written
    # exactly once and marked done, so posts never duplicate.
    - cron: "0 6 * * 2"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        run: npm run generate-blog
        env:
          OPENAI_API_KEY: ${{ secrets.NOA_BLOG }}

      # Auto-commit the new post AND the updated topics.json (which marks the
      # topic done). Committing topics.json is essential — without it the same
      # topic regenerates every week and duplicates return.
      - name: Commit and push
        run: |
          git config user.name "samharris26"
          git config user.email "99657574+samharris26@users.noreply.github.com"
          git add blog/posts/ scripts/topics.json
          if git diff --cached --quiet; then
            echo "No new post to commit (topic queue may be empty)"
          else
            git commit -m "blog: add post for $(date -u +%Y-%m-%d)"
            git push
          fi
