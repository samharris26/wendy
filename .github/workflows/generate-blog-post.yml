name: Generate Daily Blog Post

on:
  schedule:
    # Run at 06:00 UTC every day (07:00 BST / 06:00 GMT)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        run: npm run generate-blog
        env:
          OPENAI_API_KEY: ${{ secrets.NOA_BLOG }}

      - name: Check for new post
        id: check
        run: |
          if git diff --quiet blog/posts/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/posts/
          git commit -m "blog: add daily post for $(date -u +%Y-%m-%d)"
          git push
